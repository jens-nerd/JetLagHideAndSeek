name: CI

on:
    pull_request:
    push:
        branches: [master]
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            # Zielversion steht in .nvmrc, damit CI und lokale Arbeit
            # (nvm use) nicht auseinanderlaufen. Dort steht 26 - die aktuelle
            # Fassung, aber bewusst keine LTS.
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # better-sqlite3 13 liegt als Fertigbauteil im npm-Paket, passend
            # zur Plattform statt zur Node-ABI. `pnpm rebuild` laeuft deshalb
            # leer durch und bleibt nur als Netz fuer Plattformen ohne
            # Fertigbauteil stehen - dort uebersetzt node-gyp.
            - run: pnpm rebuild better-sqlite3

            - run: pnpm shared:build

            # vitest transpiliert ueber esbuild und prueft keine Typen. tsc
            # (ueber pnpm backend:build) faengt einen Typfehler zuverlaessig,
            # bevor die Tests ueberhaupt starten.
            - name: Backend-Typen pruefen
              run: pnpm backend:build

            # astro build transpiliert nur und prueft keine Typen. Ohne diesen
            # Schritt kaeme ein Typfehler in einer .astro- oder .tsx-Datei
            # durch beide Netze bis in die Produktion. astro check zieht dafuer
            # den Astro-Language-Server heran, der auch .astro-Dateien liest.
            # Rot wird der Schritt nur bei Fehlern; Hinweise (derzeit 100,
            # ueberwiegend ungenutzte Importe im geerbten Fremdcode) nicht.
            - name: Frontend-Typen pruefen
              run: pnpm run check

            # Probebau: hier wird gebaut, was der Server gleich noch einmal
            # baut. Ein gescheiterter Bau in Actions hinterlaesst nichts, ein
            # gescheiterter Bau auf dem Server einen halben Zustand - neues
            # backend/dist und neue node_modules, aber kein getauschtes Webroot.
            - name: Probebau Frontend
              run: pnpm build

            - name: Backend tests
              run: pnpm --filter @hideandseek/backend test

            - name: Frontend tests
              run: pnpm test -- --run

    deploy:
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency:
            group: deploy-vps
            cancel-in-progress: false
        steps:
            - name: SSH-Schlüssel und Host-Key einrichten
              run: |
                  mkdir -p ~/.ssh && chmod 700 ~/.ssh
                  printf '%s\n' "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts

            # Der Commit, der gerade gruen geworden ist, wird mitgegeben.
            # Das erzwungene Kommando in authorized_keys verwirft ihn als
            # Kommando und reicht ihn in SSH_ORIGINAL_COMMAND durch; deploy.sh
            # rollt genau diesen Stand aus statt der jeweiligen Spitze von
            # master, die zwei Pushes spaeter eine andere sein kann.
            - name: Deploy auslösen
              run: ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes deploy@91.98.85.53 "${{ github.sha }}"
