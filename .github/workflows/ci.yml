name: CI

on:
    pull_request:
    push:
        branches: [master]
    workflow_dispatch:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # pnpm's build-script allowlist means better-sqlite3 isn't compiled
            # during `pnpm install`. Rebuild it explicitly so tests can load the
            # native binding. See MEMORY.md ("better-sqlite3 native bindings").
            - run: pnpm rebuild better-sqlite3

            - run: pnpm shared:build

            - name: Backend tests
              run: pnpm --filter @hideandseek/backend test

            - name: Frontend tests
              run: pnpm test -- --run

    deploy:
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency:
            group: deploy-vps
            cancel-in-progress: false
        steps:
            - name: SSH-Schlüssel und Host-Key einrichten
              run: |
                  mkdir -p ~/.ssh && chmod 700 ~/.ssh
                  printf '%s\n' "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts

            - name: Deploy auslösen
              run: ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes deploy@91.98.85.53
